# Local POC: Keycloak 26.6 with direct mTLS, the X.509 Issuer LoA SPI and a pre-built realm.
#
# Prerequisites (see README.md):
#   scripts/generate-certs.sh   -> ./certs
#   scripts/build-spi.sh        -> ./spi/target/x509-issuer-loa-authenticator.jar
#
# Endpoints:
#   https://localhost:8443/admin                         Admin console (admin / admin)
#   https://localhost:8443/realms/acr-poc/account        Account console (register a passkey here)
#   http://localhost:8081/callback                       Static OAuth2 callback page (shows the auth code)
name: kc-acr-amr-poc

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
    command:
      - start-dev
      - --import-realm
      - --hostname=https://localhost:8443
      - --http-enabled=false
      - --https-port=8443
      - --https-certificate-file=/opt/keycloak/conf/certs/server-chain.crt
      - --https-certificate-key-file=/opt/keycloak/conf/certs/server.key
      # mTLS: ask for (but do not require) a client certificate on every TLS handshake.
      # Users without a certificate can still log in with passkey/password.
      - --https-client-auth=request
      - --https-trust-store-file=/opt/keycloak/conf/certs/truststore.p12
      - --https-trust-store-password=${TRUSTSTORE_PASSWORD:-changeit}
      - --https-trust-store-type=PKCS12
      # Direct TLS termination in Keycloak -> the "default" lookup reads the cert from the TLS session.
      # Behind a proxy use e.g. --spi-x509cert-lookup--provider=nginx (see docs/admin-guide.md).
      - --spi-x509cert-lookup--provider=default
      - --health-enabled=true
      - --log-level=INFO,com.example.keycloak.x509loa:DEBUG,org.keycloak.authentication.authenticators.x509:DEBUG
    environment:
      # Local development only — never reuse outside this POC.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    ports:
      - "8443:8443"
    volumes:
      - ./spi/target/x509-issuer-loa-authenticator.jar:/opt/keycloak/providers/x509-issuer-loa-authenticator.jar:ro
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./certs:/opt/keycloak/conf/certs:ro
    healthcheck:
      # The image has no curl; probe the management interface (HTTPS, port 9000) via bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  # Tiny static page that displays ?code=...&state=... after login so it can be pasted into Bruno.
  callback:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    ports:
      - "8081:8080"
    volumes:
      - ./callback/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./callback/index.html:/usr/share/nginx/html/index.html:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
