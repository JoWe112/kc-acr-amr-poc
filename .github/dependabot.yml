version: 2
updates:
  - package-ecosystem: maven
    directory: /spi
    schedule:
      interval: weekly
    # The Keycloak version must match the target server; bump it deliberately together with the image.
    ignore:
      - dependency-name: "org.keycloak:*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Bumped by hand together with keycloak.version in spi/pom.xml (the SPI is compiled against it).
    ignore:
      - dependency-name: "*keycloak/keycloak"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
