# Serves the static OAuth2 callback page for every path (e.g. /callback?code=...).
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'" always;
    add_header Referrer-Policy "no-referrer" always;
    location / {
        try_files /index.html =404;
    }
}
